name: Live KP Astrology Rolling Dashboard

on:
  schedule:
    # हर घंटे के 0वें मिनट पर अपने आप चलेगा (55-मिनट लूप के साथ पूरा दिन कवर करेगा)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: live-astro-engine
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph gspread oauth2client pytz

      - name: Run Live Astro Engine
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python astro_engine.py
