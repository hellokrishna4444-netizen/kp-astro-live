name: Live KP Astrology Rolling Dashboard

on:
  schedule:
    # Har 15 minute me chalega taaki Today ki sheet LIVE update hoti rahe
    # Aur raat 12 baje automatic purana din delete aur naya din add ho jaye
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual run button

jobs:
  update-astro-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Astrology Engine
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python astro_engine.py
